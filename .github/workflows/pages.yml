name: Сборка и публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # preview — сайт с черновиками и пометкой «Предпросмотр»; dist — только утверждённые материалы.
  SITE_MODE: preview

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверки
        run: python -m unittest discover -s tests
      - name: Сборка
        run: |
          if [ "$SITE_MODE" = "dist" ]; then python scripts/lmb.py build; else python scripts/lmb.py preview; fi
      - name: Демонстрация шаблона по отдельному адресу /demo/
        # Нейтральная техническая фикстура; в каталог учебной базы не входит. Только в режиме preview.
        if: env.SITE_MODE == 'preview'
        run: |
          python scripts/lmb.py demo
          cp -r demo/site "$SITE_MODE/demo"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_MODE }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
